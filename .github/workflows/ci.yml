name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ['3.2', '3.3', '3.4', '4.0']
        include:
          - os: macos-latest
            ruby: '3.4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install metadata tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl mat2 qpdf ffmpeg attr acl
      - name: Install metadata tools (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: brew install exiftool qpdf mat2 ffmpeg
      - name: Fail if any macOS tool is missing
        if: runner.os == 'macOS'
        run: |
          for t in exiftool mat2 qpdf ffmpeg; do
            command -v "$t" >/dev/null || { echo "::error::$t did not install on the macOS runner"; exit 1; }
          done
      - name: Record tested tool versions
        run: ./bin/metaclean --version
      - run: bundle exec rake test

  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec bundler-audit check --update

  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Install metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl mat2 qpdf ffmpeg ghostscript attr acl
      - run: bundle exec ruby -Itest test/coverage_runner.rb

  format-matrix:
    name: Real-file format matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Install cleaning tools + format generators
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl mat2 qpdf ffmpeg \
            imagemagick ghostscript zip unzip
      - name: Run the format matrix
        env:
          METACLEAN_FORMAT_MATRIX: '1'
        run: bundle exec ruby -Itest test/test_format_matrix.rb
