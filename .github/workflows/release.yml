name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruby-compat:
    name: Release compatibility (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl mat2 qpdf ffmpeg attr acl
      - run: bundle exec rake test

  verify:
    name: Verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Verify pushed tag matches gem version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(ruby -r ./lib/metaclean/version -e 'print Metaclean::VERSION')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match gem version v${version}"
            exit 1
          fi
      - name: Verify release commit belongs to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Release tag must point to a commit reachable from main"
            exit 1
          fi
      - name: Install metadata tools + format-matrix generators
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl mat2 qpdf ffmpeg \
            imagemagick ghostscript zip unzip attr acl
      - run: bundle exec rake test
      - run: bundle exec rubocop
      - run: bundle exec bundler-audit check --update
      - run: bundle exec ruby -Itest test/coverage_runner.rb
      - name: Run the real-file format matrix
        env:
          METACLEAN_FORMAT_MATRIX: '1'
        run: bundle exec ruby -Itest test/test_format_matrix.rb

  build:
    name: Build & publish gem
    needs: [verify, ruby-compat]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build gem
        run: bundle exec rake build

      - name: Smoke-test that the built gem installs and loads
        run: |
          gem install --local pkg/*.gem
          ruby -e "require 'metaclean'; abort 'VERSION missing' if Metaclean::VERSION.to_s.empty?"
          metaclean --version

      - name: Upload gem as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: metaclean-gem
          path: pkg/*.gem

      - name: Attach gem to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: pkg/*.gem
          generate_release_notes: true

      - name: Publish to RubyGems via Trusted Publisher
        if: startsWith(github.ref, 'refs/tags/')
        uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092 # v1
