AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'pkg/**/*'
    - 'vendor/**/*'
    - 'tmp/**/*'

Layout/LineLength:
  Max: 130
  Exclude:
    - 'test/**/*'

Metrics/AbcSize:
  Max: 55
  AllowedMethods: [option_parser]
Metrics/BlockLength:
  Max: 35
Metrics/ClassLength:
  Max: 350
  Exclude:
    - 'test/**/*'
Metrics/CyclomaticComplexity:
  Max: 16
Metrics/MethodLength:
  Max: 60
Metrics/ModuleLength:
  Max: 200
Metrics/PerceivedComplexity:
  Max: 16

Style/Documentation:
  Enabled: false
Style/RescueStandardError:
  Enabled: false
Style/SingleLineMethods:
  Enabled: false
Style/Semicolon:
  Enabled: false
Style/StringLiterals:
  Enabled: false
Style/FormatStringToken:
  Enabled: false
Style/ConcatArrayLiterals:
  Enabled: false
Style/RedundantFreeze:
  Enabled: false
Style/HashExcept:
  Enabled: false
Style/GuardClause:
  Enabled: false
Style/IfUnlessModifier:
  Enabled: false
Naming/MethodParameterName:
  Enabled: false
Layout/HashAlignment:
  Enabled: false
Layout/SpaceAfterSemicolon:
  Enabled: false
Layout/EmptyLinesAroundAccessModifier:
  Enabled: false
Layout/ExtraSpacing:
  Enabled: false
Lint/NonAtomicFileOperation:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false

Naming/VariableNumber:
  Exclude:
    - 'test/**/*'
Style/FetchEnvVar:
  Exclude:
    - 'test/**/*'
Style/HashLikeCase:
  Exclude:
    - 'test/**/*'
Style/RedundantLineContinuation:
  Exclude:
    - 'test/**/*'
